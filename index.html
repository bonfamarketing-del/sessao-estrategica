<style>
:root {
  /* Bonfá: preto e vermelho sobre papel claro. Uma pergunta por tela, conteúdo centralizado na vertical, navegação fixa embaixo. */
  --paper: #f2efec;
  --field: #f8f6f4;
  --ink: #141010;
  --muted: #5e5654;
  --line: #8d8582;
  --red: #d7262c;
  --red-dark: #b81e23;
  --green: #1e9e52;
  --green-dark: #17803f;
  --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.5;
  display: flex; flex-direction: column;
}
.bar { position: sticky; top: 0; height: 4px; background: #dcd6d2; z-index: 2; }
.bar i { display: block; height: 100%; width: 0; background: var(--red); transition: width .35s ease; }

.topo { background: #11011b; }
.top { width: 100%; max-width: 640px; margin: 0 auto; padding: 14px 24px; }
.logo-img { display: block; height: 52px; width: auto; }
.logo { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -0.02em; color: var(--ink); }
.logo b { color: var(--red); }

main {
  flex: 1; width: 100%; max-width: 640px; margin: 0 auto;
  padding: 24px 24px 130px;
  display: flex; flex-direction: column; justify-content: center;
}
.tela { display: none; }
.tela.on { display: block; animation: entra .3s ease; }
@keyframes entra { from { opacity: .3; transform: translateY(10px); } to { opacity: 1; transform: none; } }

h1, .q {
  font-family: var(--display); font-weight: 700; letter-spacing: -0.02em;
  font-size: clamp(28px, 7vw, 38px); line-height: 1.12; margin: 0 0 10px; text-wrap: balance;
}
h1 { font-weight: 800; font-size: clamp(32px, 8vw, 44px); }
h1 .r { color: var(--red); }
.sub { color: var(--muted); margin: 0 0 20px; }
.sub strong { color: var(--ink); }

.pontos { border-left: 2px solid #cfc8c4; padding: 4px 0 4px 18px; margin: 22px 0 0; display: grid; gap: 10px; color: var(--muted); }
.pontos div { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: baseline; }
.pontos div::before { content: "✓"; width: 18px; height: 18px; background: var(--green); color: #fff; border-radius: 50%; font-size: 11px; font-weight: 800; display: grid; place-items: center; transform: translateY(2px); }
.aviso { margin-top: 16px; font-style: italic; color: var(--muted); }
.aviso strong { color: var(--ink); font-style: normal; }

.opts { display: grid; gap: 12px; margin-top: 18px; }
.opt {
  width: 100%; text-align: left; padding: 17px 20px; min-height: 60px;
  background: var(--field); border: 1.5px solid var(--line); border-radius: 4px;
  font: inherit; color: var(--ink); cursor: pointer; transition: background .15s, border-color .15s;
}
.opt:hover { border-color: var(--ink); }
.opt[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.opt:focus-visible, .btn:focus-visible, .voltar:focus-visible, .dia:focus-visible, .hora:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

.campo { display: flex; margin-top: 18px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--field); overflow: hidden; }
.campo:focus-within { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.prefixo { flex: none; display: flex; align-items: center; gap: 8px; padding: 0 18px; background: #e6e1dd; font-weight: 700; color: var(--ink); }
.campo input, .campo textarea {
  flex: 1; min-width: 0; border: 0; background: transparent; padding: 18px 20px;
  font: inherit; font-size: 19px; color: var(--ink); outline: none;
}
.campo textarea { min-height: 120px; resize: vertical; }
.erro { color: #a3191e; margin-top: 12px; min-height: 24px; }

/* agenda */
.dias { display: flex; gap: 10px; overflow-x: auto; margin-top: 18px; padding-bottom: 6px; }
.dia {
  flex: none; min-width: 78px; padding: 10px 8px; text-align: center; cursor: pointer;
  background: var(--field); border: 1.5px solid var(--line); border-radius: 4px; font: inherit; color: var(--ink);
}
.dia small { display: block; font-size: 13px; color: var(--muted); text-transform: capitalize; }
.dia b { font-size: 19px; font-variant-numeric: tabular-nums; }
.dia[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.dia[aria-pressed="true"] small { color: #d8d2cf; }
.horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; margin-top: 14px; }
.hora {
  padding: 14px 0; cursor: pointer; font: inherit; font-weight: 700; font-variant-numeric: tabular-nums;
  background: var(--field); border: 1.5px solid var(--line); border-radius: 4px; color: var(--ink);
}
.hora[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }

.resumo { margin-top: 18px; border: 1.5px solid #cfc8c4; border-radius: 4px; background: var(--field); padding: 6px 18px; }
.resumo div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid #e3dcd8; }
.resumo div:last-child { border-bottom: 0; }
.resumo span { color: var(--muted); }


.apto { display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: start; background: #e9f7ee; color: #0f3d22; border: 2px solid #1e9e52; border-radius: 6px; padding: 18px; margin-bottom: 22px; }
.apto .selo { width: 44px; height: 44px; border-radius: 50%; background: #1e9e52; color: #fff; display: grid; place-items: center; font-size: 22px; font-weight: 800; }
.apto b { display: block; font-family: var(--display); font-size: 21px; line-height: 1.2; margin-bottom: 4px; text-wrap: balance; }
.apto span { color: #2f5a40; font-size: 15px; }
.valor { margin-top: 18px; border: 2px solid var(--ink); border-radius: 6px; padding: 18px 20px; background: #fff; }
.valor-tit { font-family: var(--display); font-weight: 700; font-size: 20px; margin: 0 0 12px; }
.valor ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.valor li { position: relative; padding-left: 28px; font-size: 16px; }
.valor li::before { content: "✓"; position: absolute; left: 2px; top: 0; color: var(--green); font-weight: 800; }
.valor-rod { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid #e3dcd8; color: var(--muted); font-size: 15px; font-style: italic; }

.eyebrow { display:inline-block; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--red); margin-bottom:10px; }
.caso { display:flex; align-items:center; gap:12px; margin: 4px 0 18px; }
.caso .av { width:46px; height:46px; border-radius:50%; background:#11011b; color:#fff; display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:15px; }
.caso b { display:block; } .caso span { color:var(--muted); font-size:14px; }
.destaque { background:#e9f7ee; border:2px solid #1e9e52; border-radius:6px; padding:16px 18px; display:flex; align-items:center; gap:14px; margin-bottom:14px; }
.destaque .x { font-family:var(--display); font-weight:800; font-size:44px; line-height:1; color:#1e9e52; }
.destaque p { margin:0; color:#0f3d22; font-weight:600; }
.nums { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.num { background:var(--field); border:1.5px solid #cfc8c4; border-radius:6px; padding:14px; }
.num b { display:block; font-family:var(--display); font-size:26px; line-height:1.1; font-variant-numeric:tabular-nums; }
.num span { color:var(--muted); font-size:14px; }
.num.full { grid-column:1 / -1; }
.graf { margin-top:14px; background:var(--field); border:1.5px solid #cfc8c4; border-radius:6px; padding:14px 14px 10px; }
.graf p { margin:0 0 10px; font-weight:700; font-size:15px; }
.bars { display:flex; align-items:flex-end; gap:8px; height:130px; }
.b { flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px; }
.b i { width:100%; background:var(--red); border-radius:3px 3px 0 0; }
.b .v { font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; }
.b small { font-size:12px; color:var(--muted); }
.passos { display:grid; gap:0; margin: 4px 0 14px; border-left:2px solid #cfc8c4; padding-left:16px; }
.passo { position:relative; padding: 8px 0; }
.passo::before { content:""; position:absolute; left:-23px; top:14px; width:12px; height:12px; border-radius:50%; background:var(--green); border:2px solid var(--paper); }
.passo .tag { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--green); }
.passo p { margin:2px 0 0; }
.print { margin: 12px 0 0; background: #fff; border: 1.5px solid #cfc8c4; border-radius: 6px; padding: 10px 12px 8px; text-align: center; }
.print img { display: block; width: 100%; max-width: 270px; margin: 0 auto; height: auto; }
.print figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; }
.tela .nums { margin-top: 12px; }
.tela .num { padding: 10px 12px; }
.tela .num b { font-size: 24px; }
.tela .proxima { margin-top: 10px; font-size: 17px; white-space: nowrap; }
.tela .num span { font-size: 13.5px; line-height: 1.35; display: block; }
.print { padding: 8px 10px 6px; }
.proxima { margin: 20px 0 0; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.2; text-align: center; color: var(--ink); text-wrap: balance; }
.fonte { font-size:12px; color:var(--muted); margin-top:12px; }

.h1-intro { font-size: clamp(25px, 6.8vw, 32px); margin-bottom: 6px; }
.q-intro { font-size: clamp(18px, 5vw, 21px); margin: 14px 0 0; }
.aviso-intro { font-size: 13px; margin-top: 10px; color: var(--muted); font-style: italic; }
.rot { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 0; }
.campo-sm { margin-top: 6px; }
.campo-sm input { padding: 13px 14px; font-size: 17px; }
/* navegação fixa */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
  background: linear-gradient(to top, var(--paper) 70%, rgba(242,239,236,0));
  padding: 24px 24px calc(22px + env(safe-area-inset-bottom));
}
nav .in { max-width: 640px; margin: 0 auto; display: flex; gap: 14px; }
.voltar {
  flex: none; width: 74px; height: 62px; border: 1.5px solid #cfc8c4; background: var(--field);
  border-radius: 4px; cursor: pointer; display: grid; place-items: center; color: var(--ink);
}
.btn {
  flex: 1; height: 62px; border: 0; border-radius: 4px; cursor: pointer;
  background: var(--green); color: #fff; font: inherit; font-size: 19px; font-weight: 600;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 20px; text-decoration: none;
}
#txtBtn { white-space: nowrap; }
@media (max-width: 400px) { .btn { font-size: 17px; } }
.btn:hover { background: var(--green-dark); }
.btn svg, .voltar svg { width: 22px; height: 22px; }


/* ===== Compacto: cada pergunta cabe na tela do celular sem rolar ===== */
.top { padding: 10px 20px; }
.logo-img { height: 40px; }
main { padding: 14px 20px 100px; }
h1 { font-size: clamp(26px, 7.2vw, 34px); margin-bottom: 6px; }
.q { font-size: clamp(22px, 6.2vw, 28px); margin-bottom: 8px; }
.sub { font-size: 15px; margin: 0 0 10px; line-height: 1.45; }
.pontos { margin-top: 14px; gap: 7px; font-size: 15.5px; padding: 2px 0 2px 16px; }
.aviso { margin-top: 10px; font-size: 15px; }
.opts { gap: 8px; margin-top: 12px; }
.opts.duas { grid-template-columns: 1fr 1fr; }
.opts.duas .opt { font-size: 15px; padding: 10px 12px; }
.opt { padding: 11px 16px; min-height: 48px; font-size: 16px; line-height: 1.35; }
.campo { margin-top: 12px; }
.campo input { padding: 15px 16px; font-size: 18px; }
.erro { margin-top: 8px; min-height: 20px; font-size: 15px; }
nav { padding: 12px 20px calc(14px + env(safe-area-inset-bottom)); }
.voltar { height: 54px; width: 64px; }
.btn { height: 54px; }
.apto { padding: 12px 14px; gap: 12px; grid-template-columns: 34px 1fr; margin-bottom: 14px; }
.apto .selo { width: 34px; height: 34px; font-size: 18px; }
.apto b { font-size: 17px; }
.apto span { font-size: 14px; line-height: 1.4; }
.dias { margin-top: 10px; gap: 8px; }
.dia { padding: 7px 6px; min-width: 66px; }
.horas { margin-top: 10px; gap: 8px; grid-template-columns: repeat(4, 1fr); }
.hora { padding: 11px 0; }
.resumo { margin-top: 10px; padding: 2px 14px; }
.resumo div { padding: 7px 0; font-size: 15px; }
.valor { margin-top: 12px; padding: 12px 14px; }
.valor-tit { font-size: 17px; margin-bottom: 8px; }
.valor ul { gap: 6px; }
.valor li { font-size: 14.5px; line-height: 1.4; }
.valor-rod { margin-top: 8px; padding-top: 8px; font-size: 13.5px; }

@media (prefers-reduced-motion: reduce) { .tela.on { animation: none; } .bar i { transition: none; } }
</style>

(() => {
  const w = document.getElementById("in_whatsapp"), ig = document.getElementById("in_instagram");

})();
const idx = id => PERGUNTAS.findIndex(p => p.id === id);
const ULTIMA_PERGUNTA = idx("gestao");

function mascaraTel(v) {
  const d = v.replace(/\D/g, "").slice(0, 11);
  if (d.length <= 2) return d.length ? "(" + d : "";
  if (d.length <= 6) return "(" + d.slice(0, 2) + ") " + d.slice(2);
  if (d.length <= 10) return "(" + d.slice(0, 2) + ") " + d.slice(2, 6) + "-" + d.slice(6);
  return "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7);
}

/* ---------- navegação ---------- */
function mostrar(i) {
  atual = i;
  registrarEtapa(PERGUNTAS[i].id);
  telas.forEach((t, k) => t.classList.toggle("on", k === i));
  const p = PERGUNTAS[i];
  const pct = p.tipo === "intro" ? 0 : i <= ULTIMA_PERGUNTA ? (i / (ULTIMA_PERGUNTA + 1)) * 92 : 100;
  $("barra").style.width = pct + "%";
  $("voltar").style.display = (p.tipo === "intro" || p.tipo === "fora" || p.tipo === "confirmar") ? "none" : "grid";
  $("continuar").style.display = (p.tipo === "confirmar" || p.tipo === "fora" || p.tipo === "intro") ? "none" : "flex";
  $("txtBtn").textContent = p.tipo === "prova" ? "Quero esse resultado" : p.tipo === "agenda" ? "Continuar" : p.tipo === "dados" ? "Agendar agora" : (i === ULTIMA_PERGUNTA ? "Enviar" : "Continuar");
  if (p.tipo === "fora") { $("voltar").style.display = "none"; $("continuar").style.display = "none"; }
  main.style.paddingBottom = (p.tipo === "confirmar" || p.tipo === "fora" || p.tipo === "intro") ? "24px" : "";
  telas[i].querySelector(".erro").textContent = "";
  window.scrollTo(0, 0);
  const foco = telas[i].querySelector("input");
  if (foco) setTimeout(() => foco.focus(), 60);
}

function erro(msg) { telas[atual].querySelector(".erro").textContent = msg; return false; }

function validar() {
  const p = PERGUNTAS[atual];
  const inp = telas[atual].querySelector("input");
  if (p.tipo === "opcoes" && !respostas[p.id]) return erro("Escolha uma opção para continuar.");
  if (inp) {
    const v = inp.value.trim();
    if (!v) return erro("Este campo é obrigatório.");
    if (p.tipo === "tel" && v.replace(/\D/g, "").length < 10) return erro("Digite o número com DDD, ex.: (31) 99999-9999.");
    if (p.tipo === "email" && !/^\S+@\S+\.\S+$/.test(v)) return erro("Digite um e-mail válido, ex.: nome@empresa.com.");
    respostas[p.id] = { v };
  }
  return true;
}

function avancar() {
  const p = PERGUNTAS[atual];
  if (p.tipo === "agenda") {
    if (!escolha.dia || !escolha.hora) return erro("Escolha um dia e um horário.");
    const data = escolha.dia.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "2-digit" });
    mostrar(idx("dados"));
    $("slotEscolhido").innerHTML = "Sessão Estratégica: <strong>" + esc(data) + " às " + esc(escolha.hora) + "</strong>";
    return;
  }
  if (p.tipo === "dados") {
    const nome = $("in_nome").value.trim(), tel = $("in_whatsapp").value.trim(), ig = $("in_instagram").value.trim();
    if (nome.length < 2) return erro("Digite o seu nome.");
    if (tel.replace(/\D/g, "").length < 10) return erro("Digite o WhatsApp com DDD, ex.: (31) 99999-9999.");
    if (!ig) return erro("Digite o Instagram da empresa (sem o @). Se não tiver, escreva \"não tem\".");
    respostas.nome = { v: nome }; respostas.whatsapp = { v: tel }; respostas.instagram = { v: ig };
    return agendar();
  }
  if (p.tipo === "intro") {
    if (!respostas.desafio) return erro("Escolha uma opção para continuar.");
    registrarEtapa("desafio");
    return mostrar(atual + 1);
  }
  if (p.tipo === "prova") { mostrar(idx("agenda")); montarAgenda(); return; }
  if (!validar()) return;
  if (p.corta !== undefined && respostas[p.id].k === p.corta) return encerrar(false);
  if (atual === ULTIMA_PERGUNTA) return encerrar(true);
  mostrar(atual + 1);
}
function voltar() {
  const p = PERGUNTAS[atual];
  if (p.tipo === "dados") return mostrar(idx("agenda"));
  if (p.tipo === "agenda") return mostrar(idx("prova"));
  if (p.tipo === "prova") return mostrar(ULTIMA_PERGUNTA);
  if (atual > 0) mostrar(atual - 1);
}
$("continuar").addEventListener("click", avancar);
$("voltar").addEventListener("click", voltar);

function encerrar(qualificado) {
  enviarWebhook(qualificado ? "qualificado" : "nao_qualificado");
  if (qualificado) { track("Lead"); mostrar(idx("prova")); }
  else {
    const n = respostas.nome ? respostas.nome.v.split(" ")[0] : "";
    $("foraNome").textContent = n ? ", " + n : "";
    mostrar(idx("fora"));
  }
}

/* ---------- agenda ---------- */
function agoraBR() { return new Date(new Date().toLocaleString("en-US", { timeZone: "America/Sao_Paulo" })); }
let ocupados = new Set();
const chaveDia = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
function horasLivres(dia) {
  const agora = agoraBR();
  const mesmo = dia.toDateString() === agora.toDateString();
  const min = agora.getHours() * 60 + agora.getMinutes() + 120;
  return CONFIG.horarios.filter(h => {
    if (ocupados.has(chaveDia(dia) + " " + h)) return false;
    if (!mesmo) return true;
    const [a, b] = h.split(":").map(Number); return a * 60 + b > min;
  });
}
async function carregarOcupados() {
  if (!CONFIG.webhook) return;
  try {
    const r = await fetch(CONFIG.webhook + "?acao=ocupados");
    const j = await r.json();
    ocupados = new Set(j.ocupados || []);
  } catch (e) {}
}
async function montarAgenda() {
  $("horas").innerHTML = '<p class="sub">Carregando horários…</p>';
  await carregarOcupados();
  const box = $("dias"); box.innerHTML = "";
  const lista = []; const d = agoraBR();
  while (lista.length < CONFIG.diasNaAgenda) {
    if (d.getDay() !== 0 && d.getDay() !== 6 && horasLivres(d).length) lista.push(new Date(d));
    d.setDate(d.getDate() + 1);
  }
  lista.forEach((dia, k) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "dia"; b.setAttribute("aria-pressed", k === 0 ? "true" : "false");
    b.innerHTML = `<small>${dia.toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", "")}</small><b>${String(dia.getDate()).padStart(2, "0")}/${String(dia.getMonth() + 1).padStart(2, "0")}</b>`;
    b.addEventListener("click", () => { box.querySelectorAll(".dia").forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); escolherDia(dia); });
    box.appendChild(b);
  });
  escolherDia(lista[0]);
}
function escolherDia(dia) {
  escolha = { dia, hora: null };
  const box = $("horas"); box.innerHTML = "";
  horasLivres(dia).forEach(h => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "hora"; b.textContent = h; b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => { box.querySelectorAll(".hora").forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); escolha.hora = h; erro(""); });
    box.appendChild(b);
  });
}
let enviando = false;
async function agendar() {
  if (enviando) return;
  const data = escolha.dia.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "2-digit" });
  const r = id => respostas[id] ? respostas[id].v : "-";
  enviando = true; $("txtBtn").textContent = "Agendando…";
  const res = await enviarWebhook("agendado", { dia: chaveDia(escolha.dia), hora: escolha.hora, data_texto: data });
  enviando = false; $("txtBtn").textContent = "Agendar agora";
  if (res === "ocupado") {
    ocupados.add(chaveDia(escolha.dia) + " " + escolha.hora);
    mostrar(idx("agenda")); escolherDia(escolha.dia);
    erro("Esse horário acabou de ser reservado. Escolha outro, por favor.");
    return;
  }
  if (res === "erro") return erro("Não conseguimos agendar agora. Verifique sua internet e toque em Agendar agora de novo.");
  $("resumo").innerHTML = [["Quando", data + " às " + escolha.hora]]
    .map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join("");
  track("Schedule");
  mostrar(idx("confirmar"));
}


/* ---------- rastreio de etapas (funil) ---------- */
const NOMES_ETAPA = {intro:"Abertura",desafio:"Desafio",cargo:"Cargo",faturamento:"Faturamento",aporte:"Aporte em tráfego",disposto:"Disposto a investir",gestao:"Preço da gestão",prova:"Prova social",agenda:"Agenda",dados:"Dados de contato",confirmar:"Agendou"};
const ORDEM_ETAPA = ["intro","desafio","cargo","faturamento","aporte","disposto","gestao","prova","agenda","dados","confirmar"];
const SESSAO = (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)).toUpperCase();
const UTM = (() => { try { const q = new URLSearchParams(location.search); return { origem: q.get("utm_source") || "", campanha: q.get("utm_campaign") || "", anuncio: q.get("utm_content") || "" }; } catch (e) { return { origem: "", campanha: "", anuncio: "" }; } })();
let etapaMax = -1;
function registrarEtapa(id) {
  const n = ORDEM_ETAPA.indexOf(id);
  if (n < 0 || n <= etapaMax) return;
  etapaMax = n;
  try { if (window.fbq) fbq("trackCustom", "EtapaFormulario", { etapa: n + 1, nome_etapa: NOMES_ETAPA[id] }); } catch (e) {}
  if (!CONFIG.webhook) return;
  const corpo = JSON.stringify(Object.assign({ status: "etapa", sessao: SESSAO, etapa_num: n + 1, etapa_nome: NOMES_ETAPA[id],
    nome: respostas.nome ? respostas.nome.v : "", whatsapp: respostas.whatsapp ? respostas.whatsapp.v : "" }, UTM));
  try { fetch(CONFIG.webhook, { method: "POST", mode: "no-cors", keepalive: true, body: corpo }); } catch (e) {}
}

function track(ev, dados) { try { if (window.fbq) fbq("track", ev, Object.assign({ content_name: "Sessão Estratégica" }, dados || {})); } catch (e) {} }
async function enviarWebhook(status, extra) {
  if (!CONFIG.webhook) return "ok"; // sem planilha configurada (prévia)
  const dados = Object.assign({ status, sessao: SESSAO }, UTM, extra || {});
  Object.keys(respostas).forEach(k => dados[k] = respostas[k].v);
  const corpo = JSON.stringify(dados);
  try {
    const r = await fetch(CONFIG.webhook, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: corpo });
    const j = await r.json();
    return j.resultado || "ok";
  } catch (e) {
    try { await fetch(CONFIG.webhook, { method: "POST", mode: "no-cors", body: corpo }); return "ok"; } catch (e2) { return "erro"; }
  }
}
